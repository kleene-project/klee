[tool.poetry]
name = "kleene-cli"
version = "0.1.0rc4"
description = "CLI for Kleene - container management tooling for FreeBSD."
authors = ["Lasse Grinderslev Andersen <lasse@philomath.dk>"]
maintainers = [
    "Lasse Grinderslev Andersen <lasse@philomath.dk>",
]
license = "BSD-2-Clause"
readme = "README.md"
homepage = "https://kleene.dev/"
repository = "https://github.com/kleene-project/klee"
documentation = "https://kleene.dev/"
keywords = ["container", "FreeBSD", "deployment"]
classifiers = [
    "Topic :: Software Development :: Build Tools"
]
packages = [
    { include = "klee" },
]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.7"
attrs = "^23.2.0"
httpx = "^0.27.0"
python-dateutil = "^2.9.0.post0"
websockets = "^14.1"
rich = "^13.7.1"
PyYAML = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
# The suite holds websockets open against a live kleened and shells out to jls
# and zfs. Without a timeout a hung test blocks the whole run indefinitely.
pytest-timeout = "^2.3.1"

[tool.pytest.ini_options]
testpaths = ["test"]
# Tests are named <thing>_test.py here rather than test_<thing>.py.
python_files = ["*_test.py"]
addopts = "--timeout=300 --timeout-method=signal"
markers = [
    "unit: pure functions -- no kleened, no root, no jails, no ZFS. The fast tier.",
]

[tool.poetry.scripts]
klee = 'klee.main:cli'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
